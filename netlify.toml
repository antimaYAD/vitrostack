[build]
  base = "frontend"
  command = "npm ci --include=dev && npm run build"
  publish = "dist"

# The backend URL is public (it is in the redirect below), not a secret. VITE_API_URL is set in the
# Netlify UI but unused by the app; omit it from secrets scanning so the deploy is not blocked.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_API_URL"

# Proxy API calls to the FastAPI backend on Render. Same-origin for the browser,
# so the SameSite=Lax auth cookie works without CORS changes. Must come before the SPA rule.
[[redirects]]
  from = "/api/*"
  to = "https://vitrostack-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Single-page app: serve index.html for client-side routes (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
