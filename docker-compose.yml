# Production-style stack: VitroStack + PostgreSQL 16.
#   cp .env.production.example .env   # then set the passwords
#   docker compose up -d --build      # app on http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vitrostack
      POSTGRES_USER: vitrostack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitrostack -d vitrostack"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://vitrostack:${POSTGRES_PASSWORD}@db:5432/vitrostack
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  pgdata:
